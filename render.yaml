# Render Blueprint - Infrastructure as Code for the live dashboard.
#
# https://render.com/docs/blueprint-spec
#
# Sync this file once (Render dashboard -> New -> Blueprint -> pick this repository) and
# every later `git push` to main redeploys the site automatically. Nothing needs to be
# typed into the Render UI, and no secrets are involved: the app has no API keys, no
# database and no outbound calls.
#
# PYTHON_VERSION is pinned because Render's default Python is newer than the pinned numpy
# 1.26.4 supports (no wheel -> a source build that fails). 3.12.6 has a binary wheel for
# every package in requirements-deploy.txt, transitive ones included.
#
# Start command flags:
#   --ws-max-size 65536      browsers only send tiny commands; refuse anything large
#   --ws-ping-interval 20    protocol-level keep-alive under Render's proxy idle timeout
#   --ws-ping-timeout 20     (the page also sends its own heartbeat and pings)
# Exactly one worker (uvicorn's default): every visitor shares one simulated race.

services:
  - type: web
    name: adaptive-traffic-signal-rl
    runtime: python
    plan: free
    region: singapore          # nearest region to India; delete this line to use the default (Oregon)
    branch: main
    autoDeploy: true           # push to main -> Render rebuilds and redeploys
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT --ws-max-size 65536 --ws-ping-interval 20 --ws-ping-timeout 20
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONUNBUFFERED    # stream logs to the Render console instead of buffering
        value: "1"
