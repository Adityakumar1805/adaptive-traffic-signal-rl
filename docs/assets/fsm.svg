<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" aria-label="Safety finite state machine: green, yellow, all-red, green, with minimum and maximum green interlocks and a proportional timing strip">
  <title>The safety layer the agent cannot bypass</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="k1"><rect x="102" y="112" width="180" height="92" rx="14"/></clipPath>
    <clipPath id="k2"><rect x="374" y="112" width="180" height="92" rx="14"/></clipPath>
    <clipPath id="k3"><rect x="646" y="112" width="180" height="92" rx="14"/></clipPath>
    <clipPath id="k4"><rect x="918" y="112" width="180" height="92" rx="14"/></clipPath>
    <clipPath id="strip"><rect x="100" y="300" width="1000" height="26" rx="8"/></clipPath>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#fbg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none"
        stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- four state cards, each with a coloured left edge -->
  <g fill="#0e1a30" stroke="#2c3d5f">
    <rect x="102" y="112" width="180" height="92" rx="14"/>
    <rect x="374" y="112" width="180" height="92" rx="14"/>
    <rect x="646" y="112" width="180" height="92" rx="14"/>
    <rect x="918" y="112" width="180" height="92" rx="14"/>
  </g>
  <g clip-path="url(#k1)"><rect x="102" y="112" width="6" height="92" fill="#22c55e"/></g>
  <g clip-path="url(#k2)"><rect x="374" y="112" width="6" height="92" fill="#f59e0b"/></g>
  <g clip-path="url(#k3)"><rect x="646" y="112" width="6" height="92" fill="#ef4444"/></g>
  <g clip-path="url(#k4)"><rect x="918" y="112" width="6" height="92" fill="#22c55e"/></g>
  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1">
    <circle cx="260" cy="136" r="9.5"/>
    <circle cx="532" cy="136" r="9.5"/>
    <circle cx="804" cy="136" r="9.5"/>
    <circle cx="1076" cy="136" r="9.5"/>
  </g>

  <!-- the agent's request enters through the minimum-green gate -->
  <rect x="133" y="16" width="118" height="28" rx="8" fill="#ffffff" fill-opacity="0.05"
        stroke="#ffffff" stroke-opacity="0.1"/>
  <polygon points="192,58 234,80 192,102 150,80" fill="#0e1a30" stroke="#c9a227"
           stroke-opacity="0.85"/>
  <!-- transitions: lines first, then arrowheads -->
  <g stroke="#2c3d5f" stroke-width="1.6" fill="none">
    <path d="M192 44V48"/>
    <path d="M288 158H364"/>
    <path d="M560 158H636"/>
    <path d="M832 158H908"/>
    <path d="M102 140H56V182H92"/>
    <path d="M240 204V226H464V214"/>
    <path d="M1008 204V262H724"/>
    <path d="M476 262H192V214"/>
  </g>
  <g fill="#7f90b3">
    <path d="M192 56L187.5 48L196.5 48Z"/>
    <path d="M192 110L187.5 102L196.5 102Z"/>
    <path d="M372 158L364 153.5L364 162.5Z"/>
    <path d="M644 158L636 153.5L636 162.5Z"/>
    <path d="M916 158L908 153.5L908 162.5Z"/>
    <path d="M100 182L92 177.5L92 186.5Z"/>
    <path d="M464 206L459.5 214L468.5 214Z"/>
    <path d="M192 206L187.5 214L196.5 214Z"/>
  </g>

  <!-- proportional timing strip: 10 s green, 3 s yellow, 2 s all-red, 10 s green -->
  <g clip-path="url(#strip)">
    <rect x="100" y="300" width="400" height="26" fill="#22c55e"/>
    <rect x="500" y="300" width="120" height="26" fill="#f59e0b"/>
    <rect x="620" y="300" width="80" height="26" fill="#ef4444"/>
    <rect x="700" y="300" width="400" height="26" fill="#22c55e"/>
  </g>
  <rect x="100" y="300" width="1000" height="26" rx="8" fill="none"
        stroke="#ffffff" stroke-opacity="0.12"/>
  <g stroke="#7f90b3" stroke-opacity="0.5" stroke-width="1">
    <path d="M100 328V334M500 328V334M620 328V334M700 328V334M1100 328V334"/>
  </g>
  <rect x="100" y="294" width="2" height="38" fill="#f1f5fd" fill-opacity="0">
    <animate attributeName="x" values="100;1100" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;0.8;0.8;0" dur="25s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- state cards -->
    <g font-size="14.5" font-weight="700" fill="#f1f5fd">
      <text x="126" y="144" textLength="81" lengthAdjust="spacingAndGlyphs">GREEN  NS</text>
      <text x="398" y="144" textLength="63" lengthAdjust="spacingAndGlyphs">YELLOW</text>
      <text x="670" y="144" textLength="64" lengthAdjust="spacingAndGlyphs">ALL RED</text>
      <text x="942" y="144" textLength="85" lengthAdjust="spacingAndGlyphs">GREEN  EW</text>
    </g>
    <g font-size="10.5" fill="#9fb0d0">
      <text x="126" y="168" textLength="71" lengthAdjust="spacing">min green 10 s</text>
      <text x="126" y="186" textLength="74" lengthAdjust="spacing">max green 60 s</text>
      <text x="398" y="168" textLength="43" lengthAdjust="spacing">3 s, fixed</text>
      <text x="670" y="168" textLength="43" lengthAdjust="spacing">2 s, fixed</text>
      <text x="942" y="168" textLength="71" lengthAdjust="spacing">min green 10 s</text>
      <text x="942" y="186" textLength="74" lengthAdjust="spacing">max green 60 s</text>
    </g>
    <g font-size="10" font-weight="700" fill="#7f90b3" text-anchor="middle">
      <text x="260" y="139.5" textLength="6" lengthAdjust="spacing">1</text>
      <text x="532" y="139.5" textLength="6" lengthAdjust="spacing">2</text>
      <text x="804" y="139.5" textLength="6" lengthAdjust="spacing">3</text>
      <text x="1076" y="139.5" textLength="6" lengthAdjust="spacing">4</text>
    </g>

    <!-- request, gate, hold, forced switch, return -->
    <text x="192" y="35" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle"
          textLength="72" lengthAdjust="spacing">agent request</text>
    <text x="192" y="85" font-size="13" font-weight="700" fill="#c9a227" text-anchor="middle"
          textLength="8" lengthAdjust="spacingAndGlyphs">?</text>
    <text x="248" y="84" font-size="10" fill="#9fb0d0"
          textLength="114" lengthAdjust="spacing">green time ≥ min green ?</text>
    <g font-size="9.5" fill="#7f90b3" text-anchor="end">
      <text x="96" y="118" textLength="47" lengthAdjust="spacing">no → hold,</text>
      <text x="96" y="131" textLength="67" lengthAdjust="spacing">request ignored</text>
    </g>
    <g font-size="9.5" fill="#7f90b3" text-anchor="middle">
      <text x="326" y="150" textLength="61" lengthAdjust="spacing">switch granted</text>
      <text x="598" y="150" textLength="34" lengthAdjust="spacing">after 3 s</text>
      <text x="870" y="150" textLength="34" lengthAdjust="spacing">after 2 s</text>
      <text x="352" y="242" textLength="174" lengthAdjust="spacing">green time = max green → forced switch</text>
    </g>
    <text x="600" y="266" font-size="10" fill="#7f90b3" text-anchor="middle"
          textLength="208" lengthAdjust="spacing">next change repeats the same yellow + all-red</text>
    <!-- timing strip labels -->
    <rect x="100" y="280" width="4" height="13" rx="2" fill="#22c55e"/>
    <text x="114" y="292" font-size="10.5" font-weight="700" fill="#93a3c4"
          textLength="218" lengthAdjust="spacing">ONE FULL CYCLE AT MINIMUM GREEN</text>
    <g font-size="9.5" font-weight="700" fill="#0a1020" text-anchor="middle">
      <text x="300" y="317" textLength="13" lengthAdjust="spacing">NS</text>
      <text x="900" y="317" textLength="15" lengthAdjust="spacing">EW</text>
    </g>
    <g font-size="10.5" font-weight="700" text-anchor="middle">
      <text x="300" y="346" fill="#22c55e" textLength="63" lengthAdjust="spacing">GREEN 10 s</text>
      <text x="560" y="346" fill="#f59e0b" textLength="62" lengthAdjust="spacing">YELLOW 3 s</text>
      <text x="660" y="346" fill="#ef4444" textLength="63" lengthAdjust="spacing">ALL RED 2 s</text>
      <text x="900" y="346" fill="#22c55e" textLength="63" lengthAdjust="spacing">GREEN 10 s</text>
    </g>
    <g font-size="9.5" fill="#7f90b3">
      <text x="100" y="346" textLength="13" lengthAdjust="spacing">0 s</text>
      <text x="1100" y="346" text-anchor="end" textLength="39" lengthAdjust="spacing">25 s total</text>
    </g>
    <text x="600" y="372" font-size="10.5" fill="#7f90b3" text-anchor="middle"
          textLength="747" lengthAdjust="spacing">conflicting greens are impossible by construction · the agent never writes to the lamps; verified over 18,000 randomised steps in tests/test_phases_safety.py</text>
  </g>
</svg>
