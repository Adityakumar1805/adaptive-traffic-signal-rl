# ==========================================================================
#  Adaptive Traffic Signal Control (RL)  —  single source of truth
#  Every module reads from here. Change values, not code.
#  Units: seconds (s), metres (m), metres/second (m/s), vehicles/second (veh/s)
# ==========================================================================

seed: 42                       # global deterministic seed
backend: auto                  # auto | sumo | mini   (auto = SUMO if available, else mini)

# --------------------------------------------------------------------------
# Road network — a grid of signalised intersections (each = one RL agent)
# --------------------------------------------------------------------------
network:
  grid_rows: 2                 # SHIPPED DEFAULT 2x2. Set 3 for a 3x3 grid (retrain!)
  grid_cols: 2
  lanes_per_approach: 1        # incoming lanes per approach direction
  link_length_m: 200           # distance between adjacent intersections
  phase_scheme: ns_ew          # ns_ew (2 phases: North-South / East-West)  | quad (4 phases)

# --------------------------------------------------------------------------
# Signal timing & safety (enforced by the environment, not the agent)
# --------------------------------------------------------------------------
signal:
  decision_interval_s: 5       # agent chooses a target phase every N seconds
  min_green_s: 10              # a green must hold at least this long before switching
  max_green_s: 60              # force a switch after this long (anti-starvation)
  yellow_s: 3                  # mandatory amber on every phase change
  all_red_s: 2                 # mandatory all-red clearance after amber

# --------------------------------------------------------------------------
# Simulation dynamics
# --------------------------------------------------------------------------
sim:
  step_length_s: 1.0           # simulation resolution
  saturation_flow_vps: 0.5     # max discharge per green lane (veh/s)  ~1 veh / 2s
  free_speed_mps: 13.9         # ~50 km/h free-flow speed
  warmup_s: 30                 # sim seconds before metrics start counting
  episode_seconds: 1800        # episode length of the live dashboard race (and the default elsewhere)

# --------------------------------------------------------------------------
# Demand — asymmetric (E-W arterial carries 2.2x the side-street rate) so that
# adaptivity genuinely helps. Demand is *stationary* within an episode: every
# scenario below sets time_varying: false, so "rush" means sustained heavy demand.
# arrival_scale multiplies the base rates below to make density scenarios.
# --------------------------------------------------------------------------
demand:
  base_arrival_vps: 0.10       # base per-source-approach arrival rate (veh/s)
  arterial_boost: 2.2          # main E-W arterial gets this much more demand (green-wave value)
  turn_prob: 0.10              # probability a vehicle turns at an intersection (else straight)
  peak_center_frac: 0.5        # only used if a scenario sets time_varying: true
  peak_width_frac: 0.2         # gaussian width of the rush peak (unused while all are false)

scenarios:
  low:    { arrival_scale: 0.35, time_varying: false, description: "Light off-peak traffic" }
  medium: { arrival_scale: 0.60, time_varying: false, description: "Moderate daytime traffic" }
  high:   { arrival_scale: 0.90, time_varying: false, description: "Heavy congested traffic" }
  rush:   { arrival_scale: 1.00, time_varying: false, description: "Rush-hour sustained heavy demand" }

# --------------------------------------------------------------------------
# Emergency-vehicle preemption
#   An emergency vehicle waiting at a junction makes that junction request the phase that
#   serves it (src/atsc/control/emergency.py). The request still goes through the safety
#   FSM, so amber and all-red are never skipped. Detection is at the stop line: the next
#   junction is pre-empted when the vehicle reaches it, not before.
# --------------------------------------------------------------------------
emergency:
  enabled: true                # dashboard switch: false hides the inject buttons and rejects
                               # injections. (The benchmark is governed by eval.inject_emergency.)
  preemption: true             # deterministic safe-corridor override
  vtype_speed_factor: 1.3      # ambulance speed factor - the benchmark's ambulance uses it, so
                               # changing it changes the published emergency-clearance numbers
  types:                       # one "Inject" button per type on the dashboard
    ambulance: { label: "Ambulance",   corridor: ew }                    # speed = vtype_speed_factor
    police:    { label: "Police car",  corridor: ns, speed_factor: 1.4 }
    fire:      { label: "Fire engine", corridor: ew, speed_factor: 1.15 }

# --------------------------------------------------------------------------
# Vehicle mix (relative weights, normalised) - COSMETIC ONLY.
#   Each vehicle's type is drawn from its own random stream, so this changes what the
#   dashboard draws and nothing else: arrivals, routes, queues and every benchmark number
#   are identical for any mix (tests/test_vehicles.py proves it). The default approximates
#   an Indian urban junction: about half two-wheelers, then autos and cars, few buses/trucks.
#   Allowed kinds: bike scooter bicycle cycle_rickshaw auto erick car taxi suv van tempo
#                  truck tractor bus school_bus   (weight 0 removes a kind)
# --------------------------------------------------------------------------
traffic_mix:
  bike: 30            # motorcycle
  scooter: 22
  bicycle: 3
  cycle_rickshaw: 1
  auto: 10            # auto-rickshaw (CNG three-wheeler)
  erick: 4            # battery e-rickshaw
  car: 15
  taxi: 3
  suv: 4
  van: 2
  tempo: 2.5          # Tata Ace-style mini-truck
  truck: 1.2
  tractor: 0.5
  bus: 1.3
  school_bus: 0.5

# --------------------------------------------------------------------------
# Reinforcement learning
# --------------------------------------------------------------------------
rl:
  algo: double_dueling_dqn     # default trainable path
  nn_backend: auto             # auto | torch | numpy  (auto = PyTorch if installed, else built-in NumPy net)
  share_parameters: true       # homogeneous agents share one network (fast, stable). false = independent nets
  neighbor_obs: true           # include neighbour pressures/phases in the state (enables coordination)
  gamma: 0.99
  lr: 0.0005
  batch_size: 64
  buffer_size: 50000
  min_buffer: 1000             # start learning after this many transitions
  target_update_every: 500     # hard target-network sync period (learner steps)
  train_every: 1               # learner update every N env control-steps
  grad_clip: 10.0
  hidden_sizes: [128, 128]
  double: true
  dueling: true
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 22000   # linear decay over this many control-steps
  per:
    enabled: true
    alpha: 0.6                 # prioritisation exponent
    beta_start: 0.4            # importance-sampling correction start
    beta_end: 1.0
    beta_steps: 20000
    eps: 0.000001

# Optional CTDE upgrade (STRETCH — off by default). See src/atsc/agents/qmix.py
qmix:
  enabled: false
  mixing_embed_dim: 32

# --------------------------------------------------------------------------
# Reward shaping (see REPORT.md for the exact math)
#   r_i = -(w_wait * step_delay_i) / normalize  - w_switch * switched_i
#         + w_emergency * emergencies_cleared_i - w_pressure * pressure_i / normalize
# --------------------------------------------------------------------------
reward:
  w_wait: 1.0
  w_pressure: 0.30
  w_switch: 0.20
  w_emergency: 5.0
  normalize: 40.0              # scales delay so rewards sit in a friendly range

# --------------------------------------------------------------------------
# Training
# --------------------------------------------------------------------------
train:
  episodes: 112                # full `python run.py train` — 112 is what produced the
                               # shipped checkpoint (112 rows in outputs/logs/train.csv)
  quick_episodes: 8            # `python run.py train --quick` (few CPU minutes)
  curriculum: [low, medium, high, rush]   # scenarios cycled during training
  episode_seconds: 1200        # shorter episodes while training (speed)
  eval_every: 10               # run a quick greedy eval every N episodes
  checkpoint_dir: models/pretrained
  log_dir: outputs/logs
  tensorboard: false           # set true if tensorboard installed

# --------------------------------------------------------------------------
# Evaluation / benchmarking
# --------------------------------------------------------------------------
eval:
  seeds: [0, 1, 2]             # the 3 seeds behind the shipped outputs/benchmark_*.csv
                               # (36 runs = 3 controllers x 4 scenarios x 3 seeds)
  scenarios: [low, medium, high, rush]
  controllers: [fixed_time, max_pressure, rl]
  episode_seconds: 1800        # length of every benchmark episode
  out_dir: outputs
  inject_emergency: true       # also measure emergency clearance time
  backend: mini                # the published numbers come from the built-in simulator, so
                               # `run.py eval` uses it even where SUMO is installed; run
                               # `python run.py eval --backend sumo` for a SUMO benchmark
                               # (written to outputs/sumo/, never over the published CSVs)

# Fixed-time baseline timing (honest, standard fixed cycle)
fixed_time:
  green_split_s: 30            # each phase gets a fixed 30 s green (NS then EW) -> 60 s cycle

# --------------------------------------------------------------------------
# Dashboard
# --------------------------------------------------------------------------
dashboard:
  host: 127.0.0.1
  port: 8000
  open_browser: true
  default_scenario: medium
  backend: mini                # the only supported value: two live SUMO instances cannot share
                               # one process, and the race needs a smooth, instant reset
  tick_ms: 200                 # server broadcast interval (real time between ticks)
  chart_window: 120            # points kept on the live line charts
  speeds: [0.2, 0.5, 1, 2, 4, 8]   # playback speeds; 1 = one 5 s decision per tick (25x real time)
  default_speed: 1
  max_clients: 100             # live WebSocket viewers; more visitors fall back to polling
  max_active_emergencies: 4    # per network, so button-mashing cannot flood the shared demo
  queue_render_cap: 24         # queued vehicles per approach sent to the browser (rest = "+n")
  keyframe_every_s: 10         # full-state resync interval for every viewer (self-healing)

# --------------------------------------------------------------------------
# Hardware-in-the-loop: the Arduino signal model (OPTIONAL, off by default)
#
#   enabled: false  ->  nothing in src/atsc/hw is imported, pyserial is not needed, and
#                       every published result stays bit-for-bit reproducible.
#
# An Arduino Uno running firmware/atsc_signal_node drives 16 signal heads (4 junctions x
# N/E/S/W, red/amber/green) through six 74HC595 shift registers, reads 8 IR sensors at
# instrumented_tls and a 4-button 433 MHz remote, and shows live figures on an OLED.
# Build guide, wiring and the viva demo: docs/HARDWARE.md.
#
#   python run.py hwtest              # check a freshly built board, part by part
#   python run.py demo --hardware     # the dashboard drives the board (flags override this block)
#
# In hardware mode the dashboard starts at "real time" (one simulated second per second),
# so the 3 s amber and 2 s all-red last 3 s and 2 s on the model; the other speeds still work.
# --------------------------------------------------------------------------
hardware:
  enabled: false               # true = every `python run.py demo` drives the board
  port: auto                   # auto | COM5 | /dev/cu.usbserial-110 | /dev/ttyUSB0 | loopback
  baud: 115200
  settle_s: 2.0                # wait after opening the port (the Uno restarts when it opens)
  heartbeat_s: 1.0             # resend the lamp frame at least this often (board watchdog: 3 s)
  detect_cooldown_s: 0.25      # ignore a second detection on one approach within this time
  mirror: rl                   # grid the lamps show: rl (the AI) | fixed (the fixed-time plan)
  realtime: true               # start at real time (--fast: start at the normal speed)
  lamps: true                  # drive the signal heads
  detectors: true              # let the IR sensors add vehicles to both grids
  rf_preemption: true          # let the remote dispatch emergency vehicles / pause
  instrumented_tls: J0_0       # the junction with the IR sensors (ids are J<row>_<col>)
